name: flutterlens_ui
description: Reusable desktop UI for FlutterLens.
version: 0.1.0-dev.1
repository: https://github.com/itskdey/flutterlens/tree/main/packages/flutterlens_ui
issue_tracker: https://github.com/itskdey/flutterlens/issues

environment:
  sdk: '>=3.6.0 <4.0.0'

resolution: workspace

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  flutterlens_core:
    version: ^0.1.0-dev.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
