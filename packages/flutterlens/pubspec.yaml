name: flutterlens
description: A modern visual inspector for Flutter.
version: 0.1.0-dev.1
repository: https://github.com/itskdey/flutterlens/tree/main/packages/flutterlens
issue_tracker: https://github.com/itskdey/flutterlens/issues

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.1'

resolution: workspace

flutter:
  uses-material-design: true

dependencies:
  dds_service_extensions: ^2.1.0
  devtools_app_shared: ^0.5.1
  devtools_extensions: ^0.5.1
  flutter:
    sdk: flutter
  flutterlens_core:
    version: ^0.1.0-dev.1
  flutterlens_ui:
    version: ^0.1.0-dev.1
  vm_service: '>=13.0.0 <16.0.0'

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
