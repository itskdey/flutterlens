name: CI

on:
  push:
    branches: [main]
  pull_request:

# New commits on a PR supersede earlier validation runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Check
        run: bash ./tool/check.sh
      - name: Build DevTools extension
        working-directory: packages/flutterlens
        run: dart run devtools_extensions build_and_copy --source=. --dest=extension/devtools
      - name: Validate DevTools extension
        working-directory: packages/flutterlens
        run: |
          set -euo pipefail
          test -f extension/devtools/build/index.html
          dart run devtools_extensions validate --package=. 2>&1 | tee extension-validation.log
          if grep -q 'Validation error' extension-validation.log; then
            echo 'DevTools extension validation reported an error.'
            exit 1
          fi
      - name: Verify publishable packages
        run: bash ./tool/check_publish.sh
